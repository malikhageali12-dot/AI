services:
  - type: web
    name: lumen-chat
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SITE_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
